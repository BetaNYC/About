name: Idea or feature request
description: Suggest an improvement or a new idea.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Early ideas are welcome. You do not need a full plan.
  - type: textarea
    id: idea
    attributes:
      label: What is the idea?
      description: What would you like to see, and who would it help?
      placeholder: It would help New Yorkers if ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why does this matter?
      description: The problem behind the idea, or who you have heard ask for it.
    validations:
      required: false
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the BetaNYC Code of Conduct.
          required: true
