name: Bug report
description: Something is broken or not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not include passwords, API keys, or other secrets.
        For security vulnerabilities, do not use this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: I expected X, but Y happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see the problem ourselves?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: false
  - type: input
    id: where
    attributes:
      label: Where did this happen?
      description: A URL, page, or file, if relevant.
    validations:
      required: false
  - type: checkboxes
    id: coc
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the BetaNYC Code of Conduct.
          required: true
