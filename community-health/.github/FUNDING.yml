# Adds a "Sponsor" button to BetaNYC repositories.
# `custom` accepts up to four URLs. BetaNYC is a fiscally sponsored project of the
# Fund for the City of New York, so the giving link may route through FCNY.
custom: ["«DONATE-URL»"]

# If BetaNYC ever sets up GitHub Sponsors or Open Collective, add here, e.g.:
# github: [BetaNYC]
# open_collective: betanyc
